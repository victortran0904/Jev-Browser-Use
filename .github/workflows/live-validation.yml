name: Live integration validation

on:
  push:
    branches: [perf/browser-architecture-20260917]
    paths:
      - .github/workflows/live-validation.yml
      - .github/scripts/live-validation.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.repository == 'victortran0904/Jev-Browser-Use' && github.ref == 'refs/heads/perf/browser-architecture-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Validate verification harness without credentials
        run: node --import tsx .github/scripts/live-validation.mjs --self-test

  live:
    needs: regression
    if: github.repository == 'victortran0904/Jev-Browser-Use' && github.ref == 'refs/heads/perf/browser-architecture-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install the lockfile-matched Chromium and test dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - name: Exercise live APIs and the real Browser Control extension
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ENABLE_SCREENSHOTS: 'false'
          CI: 'true'
        run: xvfb-run -a node --import tsx .github/scripts/live-validation.mjs
      - name: Upload allowlisted results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-validation-${{ github.sha }}
          path: .ci-results/live-validation.json
          if-no-files-found: warn
          retention-days: 7
