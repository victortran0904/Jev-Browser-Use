name: Architecture E2E
on:
  push:
    branches: [perf/browser-architecture-20260917]
    paths: ['server/**', 'tests/**', 'integration/**', '.github/scripts/architecture-e2e.mjs', '.github/workflows/architecture-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'victortran0904/Jev-Browser-Use' && github.ref == 'refs/heads/perf/browser-architecture-20260917' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - run: npm test -- --maxWorkers=1
      - run: npm run typecheck
      - run: npm run build
      - name: Real-browser invariant regressions
        run: node --import tsx --test --test-concurrency=1 integration/*.checks.mjs
  journeys:
    needs: regression
    if: github.repository == 'victortran0904/Jev-Browser-Use' && github.ref == 'refs/heads/perf/browser-architecture-20260917'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')) && '["deterministic","live","public-flight"]' || '["deterministic"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium
      - name: Execute browser journeys
        env:
          GEMINI_KEY: ${{ matrix.mode != 'deterministic' && secrets.GEMINI_KEY || '' }}
          TYPESAFE_API_KEY: ${{ matrix.mode != 'deterministic' && secrets.TYPESAFE_API_KEY || '' }}
          ENABLE_SCREENSHOTS: 'false'
          CI: 'true'
          JOURNEY_MODE: ${{ matrix.mode }}
        run: xvfb-run -a node --import tsx --import ./integration/report-on-exit.mjs .github/scripts/architecture-e2e.mjs "--$JOURNEY_MODE"
      - name: Upload sanitized result metadata only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: architecture-${{ matrix.mode }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .ci-results/architecture-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 7
